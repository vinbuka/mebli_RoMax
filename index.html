<style>
:root{--ink:#1b2430;--bg:#eef1f4;--card:#fff;--ac:#0b6e8a;--wn:#b45309;--ok:#15803d;--ln:#d5dbe1}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;background:var(--ac);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;display:flex;gap:6px;flex-wrap:wrap;z-index:5}
header select,header input{flex:1;min-width:0;font:inherit;padding:8px;border:0;border-radius:8px}
main{padding:12px;max-width:720px;margin:auto}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--ln);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1 0 auto;border:0;background:none;padding:14px 12px;font:inherit;font-size:14px;color:#566;white-space:nowrap}
nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px var(--ac)}
.c{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px}
.s{color:#566;font-size:14px}.g{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}.w{color:var(--wn)}.ok{color:var(--ok)}
.r{display:flex;gap:8px;margin-top:8px}
button,.btn{font:inherit;padding:12px 14px;border:1px solid var(--ln);background:#fff;border-radius:10px;color:var(--ink)}
button.pri{background:var(--ac);color:#fff;border:0;width:100%;margin-top:8px;font-weight:600}
input,select{font:inherit}main input,main select,#m input{padding:11px;border:1px solid var(--ln);border-radius:8px;width:100%;margin:4px 0}
.bar{height:8px;background:var(--ln);border-radius:4px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok)}
#m{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;z-index:9}#m.on{display:flex}
#m>div{background:#fff;width:100%;max-width:720px;margin:auto;border-radius:16px 16px 0 0;padding:16px;max-height:85vh;overflow:auto}
.mr{display:flex;align-items:center;justify-content:space-between;gap:10px}.mr input{width:110px!important}
h3{margin:4px 0 8px}.e{text-align:center;color:#566;padding:24px}.chk{display:inline-flex;align-items:center;gap:4px;margin-right:10px}.chk input{width:auto!important}

<script>
let WS=['Стандарт','Металу','Складання'];const ROLE={brig:'Бригадир',master:'Майстер'},K='mebli_v1';
const T={home:'Головна',dist:'Заплановано',fact:'Виробництво',rep:'Звіти',hist:'Історія',set:'Налаштування'};
const TABS={brig:['dist','fact','rep','set'],master:['home']};
// ДАНІ: зараз localStorage (лише прототип). Для етапу 2 замінити load/save на запити до сервера.
const DEFAULT_SERVER='https://script.google.com/macros/s/AKfycbwVGwFOtTBCftnyG3r2ijDB4R5lyKcYPvOYozAw7PXVA_OU9Sfn_zl5DaWWbxqTc-oc2A/exec'; // ← вставте сюди посилання на скрипт (…/exec), тоді воно буде на всіх телефонах одразу
const SRC={ // Google Таблиці (доступ: «усім, у кого є посилання» — Читач)
 ref:{id:'1xJAejvM4HHMqfeja9SjbKrCN_MiZFjqhMpVLCAdlBf8',ws:'Цехи',masters:'Майстри'}, // Довідник: вкладки «Цехи» і «Майстри»
 plan:{id:'1sdmtfqTQPTwymuy0VPmyDHWtz9jhHcII9KhJPqFu8GI',gid:0}, // Список у роботу (план)
 alloc:{id:'1-e4pbCi01HnGEpN36ioBQ_s6G1lzwq5nqjbXzXPpDXc',gid:0}}; // Розподіл по майстрах, вкладка «Розподіл»
const INIT_PW='777'; // початковий пароль бригадира, поки на пристрої немає пароля, підтвердженого сервером
let S=JSON.parse(localStorage.getItem(K)||'null')||{cat:[],masters:[],plan:[],alloc:{},fact:[],log:[],closed:{}};
const save=()=>localStorage.setItem(K,JSON.stringify(S));
if(S.wsNames)WS=S.wsNames;
if(!S.server&&DEFAULT_SERVER)S.server=DEFAULT_SERVER;
const $=s=>document.querySelector(s),id=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const addDay=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return iso(x)};
const nwd=d=>{let x=addDay(d,1);while([0,6].includes(new Date(x+'T12:00').getDay()))x=addDay(x,1);return x};
const disp=k=>k.replace(/\|$/,'').replace('|',' · '),sum=o=>Object.values(o||{}).reduce((a,b)=>a+b,0);
const U={tab:'home',date:iso(new Date()),ws:0,role:'master',master:'',rp:'week'};
const lg=t=>{S.log.push({t:Date.now(),r:ROLE[U.role],x:t});save()};
const rows=()=>S.plan.filter(p=>p.date==U.date&&p.ws==U.ws);
const closed=()=>!!S.closed[U.date+'|'+U.ws];
function calc(p){const un=new Set((S.out||[]).map(o=>o.id)),f=S.fact.filter(x=>x.pid==p.id&&un.has(x.id)).reduce((a,x)=>a+x.qty,0)+(p.sdone||0);
 const target=p.qty,rem=Math.max(0,target-f);return{al:sum(AL(p)),target,done:f,rem,over:Math.max(0,f-target),lim:p.date<U.date?rem:target}}
function demo(){const n=['Стіл LONG','Стіл LONG maxi 3,0 м','Стіл ELIPS slide 1300(1700)x750x850','Стіл Ronni slide 1100(1500)x750x750','Стіл OSCAR slide D900','Комод LOFT 1200'];
 S.cat=n.map(x=>({k:x+'|'}));S.masters=[['Іваненко',[0,1]],['Петренко',[0]],['Коваленко',[0,2]],['Шевченко',[2]],['Мельник',[1]]].map(([name,ws])=>({id:id(),name,ws}));
 const t=iso(new Date()),y=nwd(t);[[t,0,0,100],[t,0,2,12],[t,1,4,6],[t,2,5,8],[y,0,0,10],[y,0,3,5]].forEach(([d,w,i,q])=>S.plan.push({id:id(),date:d,ws:w,item:S.cat[i].k,qty:q}));S.plan.filter(p=>p.ws==2).forEach(p=>{p.order='МР000007315 · 00085467';p.char='Бетонний Камінь / Чорний мат'});save()}
const card=(p,m)=>{const c=calc(p),a=AL(p),nm=Object.keys(a).map(k=>{const x=S.masters.find(z=>z.id==k);return x?x.name+' '+a[k]:''}).join(', ');
 return`<div class="c" ${m=='d'?`data-act="alloc" data-id="${p.id}" style="cursor:pointer"`:''}><b>${esc(disp(p.item))}</b>${sub(p)}
 <div class="s">План ${p.qty}${p.carry?` + перенос ${p.carry}`:''}${p.credit?` · зараховано з учора ${p.credit}`:''}</div>
 <div class="g"><span>Розподілено <b class="${c.al<c.lim?'w':''}">${c.al}</b>/${c.lim}</span><span>Зроблено <b>${c.done}</b></span><span class="${c.rem?'w':'ok'}">Залишок <b>${c.rem}</b></span>${c.over?`<span class="ok">Перевиконання +${c.over}</span>`:''}</div>
 ${m=='d'&&nm?`<div class="s">${esc(nm)}</div>`:''}
 ${m=='p'&&U.role=='boss'?`<div class="r"><button data-act="eq" data-id="${p.id}">Змінити кількість</button><button data-act="del" data-id="${p.id}">Видалити</button></div>`:''}</div>`};
const wk=d=>{const g=(new Date(d+'T12:00').getDay()+6)%7;return[addDay(d,-g),addDay(d,6-g)]};
const per=()=>{const d=U.date;return U.rp=='day'?[d,d]:U.rp=='week'?wk(d):[d.slice(0,8)+'01',iso(new Date(+d.slice(0,4),+d.slice(5,7),0))]};
const dv=(f,p)=>{const d=f-p;return`<b class="${d<0?'w':'ok'}">${d>0?'+':''}${d}</b>`};
const SW=()=>[U.ws].map(i=>{const w=WS[i];const r=S.plan.filter(p=>p.date==U.date&&p.ws==i).map(calc),t=sum(r.map(x=>x.target)),d=sum(r.map(x=>Math.min(x.done,x.target))),rem=sum(r.map(x=>x.rem)),ov=sum(r.map(x=>x.over));
  return`<div class="c"><b>Цех ${w}</b>${S.closed[U.date+'|'+i]?' <span class="s">(день закрито)</span>':''}<div class="g"><span>План <b>${t}</b></span><span>Факт <b>${d}</b></span><span class="${rem?'w':'ok'}">Залишок <b>${rem}</b></span>${ov?`<span class="ok">+${ov}</span>`:''}</div><div class="bar"><i style="width:${t?Math.round(d/t*100):0}%"></i></div></div>`}).join('');
let RT='';
const AL=p=>p.date>=U.date||(S.adate||{})[p.id]==U.date?(S.alloc[p.id]||{}):{};
const od=()=>S.plan.filter(p=>p.date<U.date&&p.ws==U.ws&&calc(p).rem>0).sort((a,b)=>a.date<b.date?-1:1);
const same=(a,b)=>a.date==b.date&&a.ws==b.ws&&a.item==b.item&&(a.order||'')==(b.order||'')&&(a.char||'')==(b.char||'')&&(a.op||'')==(b.op||'');
const sub=p=>{const a=[p.date<U.date&&'Прострочено з '+p.date,p.op,p.order&&'Замовлення '+p.order,p.char].filter(Boolean);return a.length?`<div class="s" style="font-size:12px">${esc(a.join(' · '))}</div>`:''};
const V={
rep(){const[a,b]=per(),W=U.role=='brig'?[U.ws]:WS.map((_,i)=>i),m={},dy={},ms={},ip=d=>d>=a&&d<=b,D=d=>dy[d]=dy[d]||{p:0,f:0},M=(w,i)=>m[w+'|'+i]=m[w+'|'+i]||{ws:w,item:i,p:0,f:0};
 S.plan.filter(p=>ip(p.date)&&W.includes(p.ws)).forEach(p=>{const r=M(p.ws,p.item),c=p.credit||0;r.p+=p.qty;r.f+=c;D(p.date).p+=p.qty;D(p.date).f+=c;Object.entries(S.alloc[p.id]||{}).forEach(([i,q])=>(ms[i]=ms[i]||{a:0,f:0}).a+=q)});
 S.fact.filter(x=>ip(x.date)&&W.includes(x.ws)).forEach(x=>{const n=x.qty-(x.next||0);M(x.ws,x.item).f+=n;D(x.date).f+=n;(ms[x.master||'-']=ms[x.master||'-']||{a:0,f:0}).f+=n});
 const L=Object.values(m).sort((x,y)=>(x.f-x.p)-(y.f-y.p)),pc=(f,p)=>p?Math.round(f/p*100)+'%':'—';
 const P=(x,y)=>y?Math.round(x/y*100):0,ln=(p,f)=>p?`заплановано ${p}, зроблено ${f} (${P(Math.min(f,p),p)}%)${f<p?`, не зроблено ${p-f} (${P(p-f,p)}%)`:''}${f>p?`, перевиконання +${f-p}`:''}`:`поза планом, зроблено ${f}`;
 RT=`ЗВІТ ПО ВИРОБНИЦТВУ\n${a}${a==b?'':' — '+b}\n`+W.map(w=>{const l=L.filter(x=>x.ws==w);return`\nЦех ${WS[w]}: ${ln(sum(l.map(x=>x.p)),sum(l.map(x=>x.f)))}\n`+l.map(x=>`• ${disp(x.item)}: ${ln(x.p,x.f)}`).join('\n')}).join('\n')+'\n\nМайстри (розподілено / зроблено):\n'+Object.entries(ms).map(([i,q])=>`• ${i=='-'?'Без майстра':(S.masters.find(z=>z.id==i)||{name:'—'}).name}: ${q.a} / ${q.f}`).join('\n');
 return`<div class="r"><button data-act="goto" data-id="dist" style="flex:1">← До заявок</button><button data-act="share" style="flex:1">Поділитися</button></div><div class="r" style="margin:8px 0 10px">${[['day','День'],['week','Тиждень'],['month','Місяць']].map(([k,t])=>`<button data-act="rp" data-id="${k}" class="${U.rp==k?'pri':''}" style="flex:1;margin:0;width:auto">${t}</button>`).join('')}</div><p class="s">Період: ${a}${a==b?'':' — '+b}${U.role=='brig'?' · цех '+WS[U.ws]:''}</p>`+
 W.map(w=>{const l=L.filter(x=>x.ws==w),p=sum(l.map(x=>x.p)),f=sum(l.map(x=>x.f)),o=sum(l.map(x=>Math.max(0,x.f-x.p))),u=sum(l.map(x=>Math.max(0,x.p-x.f)));
  return`<div class="c"><b>Цех ${WS[w]}</b><div class="g"><span>План <b>${p}</b></span><span>Факт <b>${f}</b></span><span>Виконання <b>${pc(f,p)}</b></span></div><div class="g"><span class="ok">Перевиконання <b>${o}</b></span><span class="w">Недовиконання <b>${u}</b></span></div><div class="bar"><i style="width:${Math.min(100,p?f/p*100:0)}%"></i></div></div>`}).join('')+
 `<h3>За номенклатурою</h3>`+(L.length?L.map(x=>`<div class="c"><b>${esc(disp(x.item))}</b>${W.length>1?` <span class="s">${WS[x.ws]}</span>`:''}<div class="g"><span>План <b>${x.p}</b></span><span>Факт <b>${x.f}</b></span><span>${dv(x.f,x.p)}</span>${x.p?'':'<span class="s">поза планом</span>'}</div></div>`).join(''):'<div class="e">За цей період даних немає</div>')+
 `<h3>За днями</h3>`+Object.keys(dy).sort().map(d=>`<div class="c mr"><span>${d}</span><span>План <b>${dy[d].p}</b> · Факт <b>${dy[d].f}</b> ${dv(dy[d].f,dy[d].p)}</span></div>`).join('')+
 `<h3>Майстри</h3>`+(Object.keys(ms).length?Object.entries(ms).sort((x,y)=>y[1].f-x[1].f).map(([i,q])=>`<div class="c mr"><span>${esc(i=='-'?'Без майстра':(S.masters.find(z=>z.id==i)||{name:'—'}).name)}</span><span>Розподілено <b>${q.a}</b> · Зроблено <b>${q.f}</b></span></div>`).join(''):'<div class="e">Даних немає</div>')},
home(){if(U.role=='master'){const rp=S.plan.filter(p=>p.date==U.date||(p.date<U.date&&calc(p).rem>0)),tot=(m,w)=>{let n=0,k=0;rp.forEach(p=>{const q=p.ws==w&&AL(p)[m];if(q){n+=q;k++}});return[n,k]};
  if(U.master){const m=S.masters.find(x=>x.id==U.master),l=rp.filter(p=>p.ws==U.mws&&AL(p)[U.master]);
   return`<button data-act="back">← Усі працівники</button><h3>${esc(m?m.name:'')} · цех ${WS[U.mws]} · ${U.date}</h3>`+(l.length?l.map(p=>`<div class="c"><b>${esc(disp(p.item))}</b>${sub(p)}<h3>${AL(p)[U.master]} шт</h3></div>`).join(''):'<div class="e">Завдань на цю дату немає</div>')}
  return`<p class="s">План на ${U.date}. Оберіть цех і прізвище.</p>`+WS.map((w,i)=>{const ms=S.masters.filter(m=>m.ws.includes(i));return`<h3>Цех ${w}</h3>`+(ms.length?ms.map(m=>{const[n,k]=tot(m.id,i);return`<div class="c mr" data-act="pick" data-id="${m.id}" data-ws="${i}" style="cursor:pointer"><b>${esc(m.name)}</b><span>${n?`<b>${n} шт</b> · позицій: ${k}`:'<span class="s">завдань немає</span>'}</span></div>`}).join(''):'<div class="e">Майстрів немає</div>')}).join('')}
 return SW()},
plan(){const r=rows();return(U.role=='boss'?`<button class="pri" data-act="addp">+ Додати в план</button><br>`:'')+(r.length?r.map(p=>card(p,'p')).join(''):'<div class="e">На цю дату в цеху немає завдань. Імпортуйте план у Налаштуваннях.</div>')},
dist(){const o=od(),r=rows(),L=a=>a.map(p=>card(p,'d')).join('');return SW()+'<p class="s">Натисніть на позицію, щоб розподілити між майстрами.</p>'+(o.length?`<h3 class="w">Прострочено (${o.length})</h3>`+L(o):'')+'<h3>План на сьогодні</h3>'+(r.length?L(r):'<div class="e">На сьогодні завдань немає</div>')},
fact(){const r=od().concat(rows()),f=S.fact.filter(x=>x.date==U.date&&x.ws==U.ws),mn=i=>i?(S.masters.find(m=>m.id==i)||{name:'?'}).name:'Без майстра';
 return(closed()?'<div class="c w">Зміну закрито, випуск змінювати не можна.</div>':'')+(r.length?r.map(p=>{const c=calc(p),a=AL(p),ks=Object.keys(a);return`<div class="c"><b>${esc(disp(p.item))}</b>${sub(p)}<div class="g"><span>До виконання <b>${c.target}</b></span><span>Зроблено <b>${c.done}</b></span><span class="${c.rem?'w':'ok'}">Залишок <b>${c.rem}</b></span></div>
 ${ks.length?ks.map(k=>`<label class="mr">${esc(mn(k))} <span class="s">призначено ${a[k]}</span><input data-fm="${k}" type="number" inputmode="numeric" min="0" placeholder="Зроблено"></label>`).join(''):`<div class="s">Розподілу немає. Запишіть загальну кількість.</div><input data-fm="" type="number" inputmode="numeric" min="0" placeholder="Скільки зроблено">`}
 <button class="pri" data-act="addf" data-id="${p.id}">Записати</button></div>`}).join(''):'<div class="e">На цю дату в цеху немає завдань</div>')+
 (f.length?'<div class="s" style="margin-top:18px;font-size:11px">Записано за день</div>'+f.map(x=>`<div class="mr" style="font-size:12px;color:#566;padding:5px 0;border-bottom:1px solid var(--ln)"><span>${esc(disp(x.item))} — ${x.qty} шт · ${esc(mn(x.master))}</span><button data-act="delf" data-id="${x.id}" style="padding:2px 9px;font-size:13px">×</button></div>`).join(''):'')+(closed()?'<button data-act="reopen" style="margin-top:12px">Відкрити зміну</button>':'<button class="pri" data-act="close" style="margin-top:12px">Закрити зміну</button>')},
hist(){return S.log.length?S.log.slice(-150).reverse().map(l=>`<div class="c"><div class="s">${new Date(l.t).toLocaleString('uk-UA')} · ${l.r}</div>${esc(l.x)}</div>`).join(''):'<div class="e">Історія порожня</div>'},
set(){return`<div class="c"><h3>Google Таблиці</h3><div class="s">Цехи, майстри, план і розподіл читаються з Google Таблиць при запуску. Таблиці мають бути відкриті за посиланням (Читач).</div><button class="pri" data-act="sync">Оновити з таблиць</button>${['ws','masters','plan','alloc'].map(k=>`<div class="s" style="margin-top:6px">${esc((S.msg||{})[k]||'—')}</div>`).join('')}</div>
 <div class="c"><h3>Скрипт запису</h3><div class="s">Apps Script (/exec) потрібен для відправлення випуску й розподілу в таблиці та для входу бригадира.</div><input id="sv" value="${esc(S.server||'')}" placeholder="https://script.google.com/macros/s/…/exec"><div class="s">Не відправлено записів випуску: ${(S.out||[]).length}</div></div>
 <div class="c"><h3>Завдання</h3><div class="s">Видаляє план, розподіл, випуск, закриті зміни та чергу невідправлених записів. Довідник, майстри, цехи й адреса сервера залишаються. План і розподіл знову завантажаться з таблиць при наступному оновленні.</div><button style="width:100%;margin-top:8px;color:#b91c1c;border-color:#b91c1c" data-act="clr">Очистити всі завдання</button></div>
 <div class="c"><h3>Резервна копія</h3><button class="pri" data-act="bk">Зберегти копію (JSON)</button><button style="width:100%;margin-top:8px" data-act="rs">Відновити з копії</button><button style="width:100%;margin-top:8px" data-act="dm0">Скинути до демо-даних</button></div>

 else if(a=='clr'){if(confirm('Очистити всі завдання?\n\nБудуть видалені: план, розподіл, випуск, закриті зміни та черга невідправлених записів.\nЗалишаться: довідник, майстри, цехи й адреса сервера.')){S.plan=[];S.alloc={};S.adate={};S.fact=[];S.closed={};S.out=[];lg('Очищено всі завдання');render()}}
